name: Full SoundForm Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  test-build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run functional tests
        run: npm test -- --reporter=verbose --maxWorkers=1 --minWorkers=1 --exclude src/math/VoiceBiometricsPhysics.test.ts

      - name: Run voice DSP suite and benchmark in isolation
        run: npx vitest run src/math/VoiceBiometricsPhysics.test.ts --reporter=verbose --maxWorkers=1 --minWorkers=1

      - name: Build production bundle
        run: npm run build

      - name: Verify Cymatics & Music visualizer in headless Chrome
        run: node scripts/verify-cymatics.mjs

      - name: Upload deployable build and visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soundform-dist-and-cymatics-qa
          path: |
            dist
            qa_screenshots/cymatics-live-verified.png
          if-no-files-found: ignore
          retention-days: 7
