name: SoundForm CI

on:
  push:
    branches: ['main', 'codex/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: soundform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build
