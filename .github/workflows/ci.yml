name: SoundForm CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

concurrency:
  group: soundform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build production application
        run: npm run build
