name: Apply Anamnesis Clock Separation

on:
  push:
    branches:
      - codex/anamnesis-song-memory

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anamnesis-song-memory
          fetch-depth: 0

      - name: Apply the deterministic source patch
        run: |
          python3 scripts/fix-anamnesis-clock.py
          git diff --check

      - name: Commit source and remove one-use scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/fix-anamnesis-clock.py
          rm .github/workflows/fix-anamnesis-clock.yml
          git add -A
          git commit -m "fix: decouple musical memory from render cadence"
          git push origin HEAD:codex/anamnesis-song-memory
