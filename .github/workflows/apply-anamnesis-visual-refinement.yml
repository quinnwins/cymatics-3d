name: Apply Anamnesis Visual Refinement

on:
  push:
    branches:
      - codex/anamnesis-song-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[visual-refinement]')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anamnesis-song-memory
          fetch-depth: 0

      - name: Apply the deterministic field patch
        run: |
          python3 scripts/refine-anamnesis-field.py
          git diff --check

      - name: Commit the source and remove one-use scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/refine-anamnesis-field.py
          rm .github/workflows/apply-anamnesis-visual-refinement.yml
          git add -A
          git commit -m "feat: give Anamnesis a luminous double-layer constellation"
          git push origin HEAD:codex/anamnesis-song-memory
