name: Fix Anamnesis Silence Sentinel

on:
  push:
    branches:
      - codex/anamnesis-song-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[silence-hotfix]')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anamnesis-song-memory
          fetch-depth: 0

      - name: Correct the Web Audio zero-buffer sentinel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/visualizer/AnamnesisModel.ts')
          source = path.read_text()
          old = '    let zeroFilled = spectrum.length === 0;\n'
          new = '    let zeroFilled = true;\n'
          if source.count(old) != 1:
              raise SystemExit('expected silence sentinel assignment not found exactly once')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit the model fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/visualizer/AnamnesisModel.ts
          git commit -m "fix: keep silence empty in Anamnesis"
          git push origin HEAD:codex/anamnesis-song-memory
