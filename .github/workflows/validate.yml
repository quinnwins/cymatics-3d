name: Build SoundForm

on:
  pull_request:
    paths:
      - .github/workflows/**
      - index.html
      - package.json
      - package-lock.json
      - src/**
      - tailwind.config.js
      - tsconfig.json
      - vite.config.ts
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - index.html
      - package.json
      - package-lock.json
      - src/**
      - tailwind.config.js
      - tsconfig.json
      - vite.config.ts

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
