name: Apply Anamnesis Transposition Alignment

on:
  push:
    branches:
      - codex/anamnesis-song-memory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[alignment-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/anamnesis-song-memory
          fetch-depth: 0

      - name: Apply inverse alignment rotation
        run: |
          python3 scripts/fix-anamnesis-transposition-alignment.py
          git diff --check

      - name: Commit source and remove one-use scaffolding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/fix-anamnesis-transposition-alignment.py
          rm .github/workflows/apply-anamnesis-transposition-alignment.yml
          git add -A
          git commit -m "fix: separate transposition labels from chroma alignment"
          git push origin HEAD:codex/anamnesis-song-memory
