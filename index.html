<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D Acoustic & Frequency Waveform Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-gray-100 overflow-hidden select-none">
    <!-- 3D WebGL Canvas Layer -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Application Layer -->
    <div id="app" class="relative z-10 w-full h-full flex flex-col justify-between pointer-events-none p-4 md:p-6">
      <!-- Top Bar: Header & Modes & Themes -->
      <header id="header-root" class="pointer-events-auto w-full flex justify-between items-start"></header>

      <!-- Center Overlay for Audio Activation / Status Prompts -->
      <div id="center-prompt-root" class="pointer-events-auto flex items-center justify-center"></div>

      <!-- Right Floating Panels: Spectrum HUD & Physics Drawer -->
      <div id="side-panel-root" class="pointer-events-auto absolute top-20 right-4 md:right-6 flex flex-col gap-3 max-h-[calc(100vh-180px)] overflow-y-auto z-20"></div>

      <!-- Bottom Bar: Playback Controls / Frequency Lab Synthesizer -->
      <footer id="footer-root" class="pointer-events-auto w-full max-w-5xl mx-auto flex flex-col items-center gap-3"></footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
