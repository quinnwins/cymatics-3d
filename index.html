<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SoundForm 3D — 3D Cymatics & Acoustic Resonance Engine</title>
    <meta name="description" content="SoundForm 3D is a high-performance browser-based 3D acoustic resonance and cymatics engine featuring vibrating Chladni sand plates, acoustic fluid droplet levitation, and GPU particle standing waves driven by live music." />
    
    <!-- OpenGraph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SoundForm 3D — 3D Cymatics & Acoustic Resonance Engine" />
    <meta property="og:description" content="See sound as matter, space, and resonance. Real-time 3D Chladni plates, levitating fluid droplets, and GPU particle trapping driven by live audio." />
    <meta property="og:image" content="https://raw.githubusercontent.com/quinnwins/cymatics-3d/main/assets/soundform-music-studio.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SoundForm 3D — 3D Cymatics & Acoustic Resonance Engine" />
    <meta name="twitter:description" content="Real-time 3D acoustic resonance engine with physical Chladni plates, levitating droplets, and GPU particle standing waves." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/quinnwins/cymatics-3d/main/assets/soundform-music-studio.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 12h2a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H2v-8z'/%3E%3Cpath d='M22 12h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2v-8z'/%3E%3Cpath d='M6 12a6 6 0 0 1 12 0'/%3E%3Cpath d='M2 12a10 10 0 0 1 20 0'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-gray-100 overflow-hidden select-none">
    <!-- 3D WebGL Canvas Layer -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Application Layer: Desktop Workstation Layout -->
    <div id="app" class="relative z-10 w-full h-full flex flex-col justify-between pointer-events-none p-3 sm:p-4 md:p-5 overflow-hidden">
      <!-- Top Bar: Header & Modes & Themes & Sidebar Toggles -->
      <header id="header-root" class="pointer-events-auto relative z-30 w-full shrink-0"></header>

      <!-- Center Workstation Grid: Left Sidebar (Controls), Center Viewport, Right Sidebar (Telemetry/Analysis) -->
      <div id="workstation-workspace" class="relative flex-1 w-full flex justify-between items-stretch pointer-events-none overflow-hidden my-2 gap-3 sm:gap-4">
        <!-- Left Sidebar: Primary Controls, Presets & Action Decks -->
        <aside id="left-sidebar-root" class="sidebar-panel sidebar-left pointer-events-auto flex flex-col gap-2.5 max-h-full overflow-y-auto custom-scrollbar z-20 transition-all duration-300 w-72 sm:w-80 md:w-84 shrink-0"></aside>

        <!-- Center Overlay for Audio Activation / Status Prompts (Unobstructed 3D Viewport) -->
        <div id="center-viewport-overlay" class="pointer-events-none relative z-20 flex-1 flex flex-col justify-center items-center h-full px-1">
          <!-- Center Overlay for Audio Activation / Status Prompts -->
          <div id="center-prompt-root" class="pointer-events-none flex items-center justify-center flex-1"></div>
        </div>

        <!-- Right Sidebar: Live Spectrum Analyzer, Real-Time Biophysical Telemetry HUDs & Physics Deck -->
        <aside id="right-sidebar-root" class="sidebar-panel sidebar-right pointer-events-auto flex flex-col gap-2.5 max-h-full overflow-y-auto custom-scrollbar z-20 transition-all duration-300 w-72 sm:w-80 md:w-84 shrink-0"></aside>
      </div>

      <!-- Bottom Bar: Slim Master Audio Transport & Global Status -->
      <footer id="bottom-transport-root" class="pointer-events-auto relative z-30 w-full shrink-0 flex justify-center items-center"></footer>
    </div>

    <!-- Floating Exit Immersive HUD (Revealed automatically during Immersive View) -->
    <button
      id="immersive-exit-hud"
      type="button"
      aria-label="Exit immersive mode"
      title="Exit immersive mode (Esc or I)"
      class="fixed top-4 right-4 z-50 glass-btn px-3 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:text-white border border-white/20 active:scale-95 shadow-2xl backdrop-blur-md flex items-center gap-2 cursor-pointer transition-all duration-150 min-h-[44px]"
    >
      <svg class="w-3.5 h-3.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14h6m0 0v6m0-6L3 21m17-11h-6m0 0V4m0 6l7-7"/>
      </svg>
      <span>Exit Immersive</span>
      <kbd class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] font-mono bg-white/10 rounded border border-white/20 text-slate-300">Esc</kbd>
    </button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
